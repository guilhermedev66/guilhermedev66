name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: guilhermedev66
          outputs: |
            dist/github-snake.svg?color_dots=#161b22,#3c1f6e,#512bd4,#6c3fdb,#b39eef&color_snake=#e5e5e5
            dist/github-snake-dark.svg?color_dots=#0a0a0a,#3c1f6e,#512bd4,#6c3fdb,#b39eef&color_snake=#ffffff&color_background=#0a0a0a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
